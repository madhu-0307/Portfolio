<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Madhu | Portfolio</title>

    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">

    <style>

        :root {
            --bg: #090714;
            --bg-light: #100c20;
            --purple: #9b6cff;
            --purple-light: #b99aff;
            --text: #f5f1ff;
            --muted: #aaa3bd;
            --border: rgba(255,255,255,0.12);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }

        /* NAVBAR */

        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            background: rgba(9,7,20,0.92);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
        }

        .navbar {
            max-width: 1150px;
            margin: auto;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: "DM Mono", monospace;
            font-size: 22px;
            font-weight: 500;
            color: white;
        }

        .logo span {
            color: var(--purple);
        }

        nav {
            display: flex;
            gap: 28px;
        }

        nav a {
            color: #aaa3bd;
            text-decoration: none;
            font-size: 14px;
            transition: 0.3s;
        }

        nav a:hover {
            color: var(--purple);
        }

        /* COMMON */

        section {
            min-height: 100vh;
            padding: 120px 30px 80px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        .section-label {
            font-family: "DM Mono", monospace;
            color: var(--purple);
            font-size: 11px;
            letter-spacing: 3px;
            text-align: center;
            margin-bottom: 12px;
        }

        .section-title {
            font-family: "Playfair Display", serif;
            font-size: 42px;
            text-align: center;
            margin-bottom: 45px;
        }

        /* HOME */

        #home {
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            background:
                radial-gradient(circle at center, #241548 0%, #100c20 35%, #090714 75%);
        }

        .home-content {
            max-width: 800px;
        }

        .home-small {
            font-family: "DM Mono", monospace;
            color: var(--purple);
            font-size: 12px;
            letter-spacing: 3px;
            margin-bottom: 20px;
        }

        .home-content h1 {
            font-family: "Playfair Display", serif;
            font-size: 70px;
            line-height: 1.1;
            margin-bottom: 20px;
        }

        .home-content h1 span {
            color: var(--purple);
        }

        .home-content p {
            max-width: 650px;
            margin: auto;
            color: var(--muted);
            font-size: 16px;
        }

        .buttons {
            margin-top: 35px;
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .btn {
            text-decoration: none;
            padding: 13px 25px;
            border-radius: 6px;
            font-size: 14px;
            transition: 0.3s;
        }

        .btn-primary {
            background: var(--purple);
            color: white;
        }

        .btn-primary:hover {
            background: var(--purple-light);
            transform: translateY(-3px);
        }
